name: Build Evolution Lab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_NDK_VERSION: 28.0.13004108
      ANDROID_PLATFORM: android-35
      ANDROID_BUILD_TOOLS: 35.0.0

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;3.22.1"

          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      # ----------------------------------------------------
      # Create Android project structure
      # ----------------------------------------------------

      - name: Create Android project
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p app/src/main/cpp/src
          mkdir -p app/src/main/java/com/evolutionlab/app
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          # Root Gradle build
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          EOF

          # Gradle settings
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'EvolutionLab4'
          include ':app'
          EOF

          # App Gradle file
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.evolutionlab.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.evolutionlab.app'
                  minSdk 21
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'

                  externalNativeBuild {
                      cmake {
                          cppFlags '-std=c++17', '-O2', '-ffast-math'
                          arguments '-DANDROID_STL=c++_shared'
                      }
                  }

                  ndk {
                      abiFilters 'arm64-v8a', 'armeabi-v7a'
                  }
              }

              buildTypes {
                  debug {
                      debuggable true
                      jniDebuggable true
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              externalNativeBuild {
                  cmake {
                      path file('src/main/cpp/CMakeLists.txt')
                  }
              }

              sourceSets {
                  main {
                      assets.srcDirs = ['src/main/assets']
                  }
              }

              packagingOptions {
                  jniLibs {
                      useLegacyPackaging true
                  }

                  resources {
                      excludes += [
                          '/META-INF/LICENSE*',
                          '/META-INF/NOTICE*'
                      ]
                  }
              }
          }

          dependencies {
          }
          EOF

          # Manifest
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:glEsVersion="0x00020000"
                  android:required="true" />

              <application
                  android:allowBackup="false"
                  android:label="Evolution Lab 4"
                  android:theme="@style/SDLActivityTheme"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name="com.evolutionlab.app.EvolutionLabActivity"
                      android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenLayout|screenSize|smallestScreenSize|uiMode"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android
