name: Build Evolution Lab APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_NDK_VERSION: 28.0.13004108
      ANDROID_PLATFORM: android-35
      ANDROID_BUILD_TOOLS: 35.0.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}" "cmake;3.22.1"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build Evolution Lab
        shell: bash
        run: |
          chmod +x ./prepare_android_project.sh
          ./prepare_android_project.sh

      - name: Verify APK
        shell: bash
        run: |
          test -s EvolutionLab4-debug.apk
          file EvolutionLab4-debug.apk
          sha256sum EvolutionLab4-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EvolutionLab4-debug-apk
          path: EvolutionLab4-debug.apk
          if-no-files-found: error
          retention-days: 14
