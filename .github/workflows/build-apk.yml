name: Build Evolution Lab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_NDK_VERSION: 28.0.13004108
      ANDROID_PLATFORM: android-35
      ANDROID_BUILD_TOOLS: 35.0.0

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;3.22.1"

          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Create Android project directories
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p app
          mkdir -p app/src/main
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res

      - name: Create app build.gradle
        shell: bash
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.evolutionlab.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.evolutionlab.app'
                  minSdk 21
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'

                  externalNativeBuild {
                      cmake {
                          cppFlags '-std=c++17', '-O2', '-ffast-math'
                          arguments '-DANDROID_STL=c++_shared'
                      }
                  }

                  ndk {
                      abiFilters 'arm64-v8a', 'armeabi-v7a'
                  }
              }

              buildTypes {
                  debug {
                      debuggable true
                      jniDebuggable true
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              externalNativeBuild {
                  cmake {
                      path file('src/main/cpp/CMakeLists.txt')
                  }
              }

              sourceSets {
                  main {
                      assets.srcDirs = ['src/main/assets']
                  }
              }

              packagingOptions {
                  jniLibs {
                      useLegacyPackaging true
                  }

                  resources {
                      excludes += [
                          '/META-INF/LICENSE*',
                          '/META-INF/NOTICE*'
                      ]
                  }
              }
          }

          dependencies {
          }
          EOF

      - name: Create proguard file
        shell: bash
        run: |
          touch app/proguard-rules.pro

      - name: Verify project files
        shell: bash
        run: |
          set -euxo pipefail

          echo "Checking files..."

          test -f build.gradle
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/cpp/CMakeLists.txt
          test -f app/src/main/cpp/src/EvolutionLab4.cpp

          echo "All required project files exist."

      - name: Build Evolution Lab
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x ./prepare_android_project.sh

          ./prepare_android_project.sh

      - name: Find APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "Searching for APK..."

          find . -type f -name "*.apk" -print

      - name: Copy APK
        shell: bash
        run: |
          set -euxo pipefail

          APK=$(find . -type f -name "app-debug.apk" | head -n 1)

          if [ -z "$APK" ]; then
              echo "ERROR: APK was not created."
              exit 1
          fi

          cp "$APK" EvolutionLab4-debug.apk

          ls -lh EvolutionLab4-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EvolutionLab4-debug-apk
          path: EvolutionLab4-debug.apk
          if-no-files-found: error
          retention-days: 14
